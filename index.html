<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NY BikeLife · MX Bikes Server Dashboard</title>
<meta name="description" content="Lap records, live timing and rider stats for the NY BikeLife MX Bikes server.">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f08a24'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='800' font-size='13' text-anchor='middle' fill='%23111'%3EMX%3C/text%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint (no flash).
  try { var t = localStorage.getItem("mxb_theme"); if (t) document.documentElement.dataset.theme = t;
        else if (matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.dataset.theme = "light"; } catch (e) {}
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="sr" href="#app">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="Dashboard home">
      <span class="brand-mark">MX</span>
      <span><span id="brand-name">NY BikeLife</span><small>MX Bikes server</small></span>
    </a>
    <nav class="main" id="nav" aria-label="Main">
      <a href="#/" data-r="home">Leaderboards</a>
      <a href="#/live" data-r="live"><span class="live-dot" id="nav-live"></span>Live</a>
      <a href="#/records" data-r="records">Records</a>
      <a href="#/riders" data-r="riders">Riders</a>
      <a href="#/tracks" data-r="tracks">Tracks</a>
      <a href="#/bikes" data-r="bikes">Bikes</a>
      <a href="#/activity" data-r="activity">Activity</a>
      <a href="#/awards" data-r="awards">Awards</a>
      <a href="#/compare" data-r="compare">Compare</a>
      <a href="#/about" data-r="about">Help</a>
    </nav>
    <div class="tools">
      <button class="icon-btn" id="units" title="Switch speed units">mph</button>
      <button class="icon-btn" id="theme" title="Switch light/dark theme" aria-label="Switch light/dark theme">◐</button>
    </div>
  </div>
</header>
<main id="app" tabindex="-1"><div class="skeleton"></div></main>
<footer id="foot"></footer>
<div class="tip" id="tip" role="tooltip"></div>
<script src="app.js"></script>
</body>
</html>
